name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish-npm:
    if: github.repository == 'Airtable/airtable-mcp-cli'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-binaries:
    runs-on: ubuntu-latest
    needs: publish-npm
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - bun-darwin-arm64
          - bun-darwin-x64
          - bun-linux-x64
          - bun-linux-arm64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - run: npm install
      - run: npm run build

      - name: Compile binary
        run: |
          SUFFIX="${{ matrix.target }}"
          SUFFIX="${SUFFIX#bun-}"
          bun build dist/bin.js --compile --target=${{ matrix.target }} --outfile "dist/airtable-mcp-${SUFFIX}"

      - name: Generate checksum
        run: |
          SUFFIX="${{ matrix.target }}"
          SUFFIX="${SUFFIX#bun-}"
          cd dist && sha256sum "airtable-mcp-${SUFFIX}" > "airtable-mcp-${SUFFIX}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/airtable-mcp-*

  publish-github-release:
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

      - name: Generate bin.js checksum
        run: sha256sum dist/bin.js > dist/bin.js.sha256

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/binaries
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/bin.js \
            dist/bin.js.sha256 \
            dist/binaries/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
